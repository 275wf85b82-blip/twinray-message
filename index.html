<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#231c36">
<meta name="description" content="ヒーリングサロン Twin Ray｜ハイヤーセルフからのメッセージ。心を静かにして、今のあなたに必要な言葉を受け取ってください。">
<title>ハイヤーセルフからのメッセージ | Healing Salon Twin Ray</title>
<style>
:root{color-scheme:dark;--white:#fff9f9;--soft:#e3d8ee;--gold:#ead6ad}*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--white);background:radial-gradient(ellipse at 52% 20%,#645176 0%,#322841 42%,#161626 100%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(1px 1px at 15% 20%,white 98%,transparent),radial-gradient(2px 2px at 83% 15%,#f8dfb9 98%,transparent),radial-gradient(1px 1px at 72% 54%,white 98%,transparent),radial-gradient(1px 1px at 27% 72%,white 98%,transparent),radial-gradient(2px 2px at 58% 89%,#e6c9ed 98%,transparent);background-size:340px 370px}.shell{position:relative;max-width:510px;margin:auto;min-height:100dvh;padding:38px 22px 35px;display:flex;flex-direction:column;align-items:center;text-align:center}.brand{font-family:Georgia,serif;letter-spacing:.26em;font-size:11px;color:#e8d5d8}.moon{width:125px;height:125px;display:grid;place-items:center;margin:29px 0 20px;border:1px solid #b8a5c469;border-radius:50%;box-shadow:0 0 55px #e4bdd32c,inset 0 0 30px #e4bdd31c;position:relative}.moon:before{content:"";position:absolute;inset:9px;border:1px solid #f6dec74b;border-radius:50%}.moon span{font-size:67px;text-shadow:0 0 22px #f7dae4a9}.eyebrow{font-size:12px;letter-spacing:.18em;color:#d7bdd5;margin:0 0 13px}.heading{font-size:clamp(24px,7vw,32px);font-weight:400;letter-spacing:.09em;line-height:1.55;margin:0;color:#fff8f6}.intro{font-size:14px;line-height:2.1;color:var(--soft);margin:21px 0 26px}.rule{height:1px;width:72px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}.card{width:100%;padding:28px 22px 26px;margin:22px 0;background:linear-gradient(150deg,#ffffff15,#ffffff09);border:1px solid #f6d8d64d;border-radius:19px;box-shadow:0 15px 44px #0905103b;animation:appear .65s ease both}.card[hidden]{display:none}.card-kicker{font-size:11px;letter-spacing:.14em;color:var(--gold)}.card-title{font-size:22px;font-weight:400;line-height:1.7;margin:14px 0;color:#f6e4d1}.message{font-size:15px;line-height:2.25;white-space:pre-line;color:#f9eff7;margin:0}.affirmation{font-size:13px;line-height:2;margin-top:19px;padding-top:18px;border-top:1px solid #ffffff29;color:#ecd7ec}.btn{width:100%;max-width:370px;border:1px solid #f0d5d3;border-radius:99px;background:linear-gradient(110deg,#eacbdc,#f5e5d2);color:#3d2a44;min-height:58px;padding:15px 24px;font-size:16px;font-family:inherit;letter-spacing:.12em;cursor:pointer;box-shadow:0 6px 28px #eacbdc38;transition:transform .18s}.btn:active{transform:scale(.98)}.hint{font-size:12px;line-height:1.9;color:#d7cad9;margin:15px 0 22px}.footer{margin-top:auto;padding-top:28px;font-size:11px;color:#c1adc4;letter-spacing:.12em}.footer small{display:block;letter-spacing:0;line-height:1.7;margin-top:12px;color:#bbaabd}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.card{animation:none}.btn{transition:none}}
</style>
</head>
<body><main class="shell">
<div class="brand">HEALING SALON · TWIN RAY</div>
<div class="moon" aria-hidden="true"><span>☾</span></div>
<p class="eyebrow">A MESSAGE FROM YOUR HIGHER SELF</p>
<h1 class="heading">ハイヤーセルフからの<br>メッセージ</h1>
<p class="intro" id="intro">少しだけ心を静かにして、深呼吸。<br>今のあなたに響く言葉を受け取ってください。</p>
<div class="rule" aria-hidden="true"></div>
<section class="card" id="result" hidden aria-live="polite"><div class="card-kicker">✧ 今日、あなたへ贈る言葉 ✧</div><h2 class="card-title" id="title"></h2><p class="message" id="message"></p><p class="affirmation" id="affirmation"></p></section>
<button class="btn" id="draw" type="button">✧ メッセージを受け取る ✧</button>
<p class="hint" id="hint">タップするたびに、新しい言葉と出会えます 🌙</p>
<footer class="footer">Healing Salon Twin Ray<small>このメッセージは心を見つめるためのヒントです。<br>未来や出来事を断定するものではありません。</small></footer>
</main>
<script>
const messages=[
{title:"あなたの光を思い出して",body:"誰かと比べなくて大丈夫。\nあなたの歩幅には、あなたにしかない美しさがあります。\n今日は自分の小さな頑張りを、そっと認めてあげてください。",a:"私は、私のままで輝いていい。"},
{title:"答えは静けさの中に",body:"急いで結論を出さなくても大丈夫。\n心が騒がしいときは、一度立ち止まって深呼吸を。\n静かな時間が、本当の願いに気づかせてくれます。",a:"私は、自分の心の声を大切にします。"},
{title:"手放すことで広がる空",body:"ずっと抱えてきた思いを、今日は少しだけ緩めてみて。\nすべてを背負わなくても、あなたの価値は変わりません。",a:"私は、必要のない重荷をやさしく手放します。"},
{title:"愛はあなたの内側から",body:"誰かに愛されるために、無理をしなくていいのです。\nまずは自分に温かな言葉をかけてみて。\nその優しさが、これからの関係も育てます。",a:"私は、私自身にも愛を向けます。"},
{title:"小さな一歩が未来をつくる",body:"大きく変わろうとしなくても大丈夫。\n今日できることを、ひとつだけ。\n小さな行動が、自信へとつながっていきます。",a:"私は、今日の一歩を信じます。"},
{title:"休むことも大切な選択",body:"頑張り続けることだけが、前進ではありません。\n疲れたときには休んでいい。\n自分をいたわる時間も、かけがえのない時間です。",a:"私は、安心して休むことを自分に許します。"},
{title:"心の境界線を守って",body:"誰かに優しくするのと同じくらい、自分を守ることも大切です。\n気が進まないことには、穏やかに『いいえ』と言ってもいいのです。",a:"私は、自分の気持ちを尊重します。"},
{title:"まだ見えない可能性へ",body:"今、道がはっきり見えなくても大丈夫。\n分からない時間にも、意味はあります。\n好奇心が向く方向へ、小さく目を向けてみましょう。",a:"私は、これからの可能性に心を開きます。"},
{title:"過去のあなたを抱きしめて",body:"あのときの自分に、今の知識を求めなくてもいいのです。\n精いっぱいだったあなたを、責めずに受け止めてください。",a:"私は、これまでの自分をやさしく受け入れます。"},
{title:"直感に耳を澄ませて",body:"頭で考えすぎたら、心地よさにも目を向けてみて。\n無理なく自然体でいられる選択が、今のあなたには合っているかもしれません。",a:"私は、自分の感覚を丁寧に確かめます。"},
{title:"あなたはひとりじゃない",body:"すべてをひとりで抱えなくていいのです。\n信頼できる人に気持ちを話すことは、弱さではなく勇気。\n温かなつながりを受け取ってください。",a:"私は、支えを受け取ってもいい。"},
{title:"幸せは今ここにもある",body:"特別な出来事がなくても、日常には小さな光があります。\nお気に入りの香り、空の色、温かい飲み物。\n今日ひとつ、幸せを見つけてみて。",a:"私は、ささやかな喜びに気づきます。"},
{title:"変化を恐れなくていい",body:"これまでの自分と違う選択をしても大丈夫。\n気持ちが変わるのは、成長している証でもあります。\n今の自分に合う道を選んでください。",a:"私は、変わっていく自分を受け入れます。"},
{title:"あなたのペースで咲いて",body:"花が咲く時期は、それぞれ違います。\n周りが進んでいるように見えても、焦らなくて大丈夫。\nあなたには、あなたの季節があります。",a:"私は、自分のタイミングを大切にします。"},
{title:"素直な願いを認めて",body:"本当はどうしたい？\n誰かの期待を少し横に置いて、自分の望みに問いかけてみて。\n小さな本音から、道が見え始めます。",a:"私は、自分の願いを否定しません。"},
{title:"許しは自分への贈り物",body:"無理に誰かを許す必要はありません。\nただ、苦しさから少し離れてもいいのです。\n自分の心が穏やかになる選択を大切に。",a:"私は、自分の心の平穏を選びます。"},
{title:"その優しさを自分にも",body:"人にかける温かな言葉を、自分にもかけてみませんか。\nうまくいかない日にも、あなたは大切な存在です。",a:"私は、私自身の味方でいます。"},
{title:"比べるより、感じて",body:"誰かの正解が、あなたの正解とは限りません。\n心が穏やかになるもの、自然に笑える瞬間を道しるべにしてみて。",a:"私は、私らしい幸せを選びます。"},
{title:"今日という贈り物",body:"昨日を変えることはできなくても、今日の過ごし方は選べます。\nいま目の前にある時間を、あなたのために使ってください。",a:"私は、今日の自分を大切にします。"},
{title:"愛を受け取る準備",body:"褒め言葉を否定せずに受け取ってみて。\n誰かの親切に『ありがとう』と微笑んでみて。\n受け取ることも、愛のひとつの形です。",a:"私は、温かな気持ちを素直に受け取ります。"},
{title:"心の声は変わっていい",body:"昨日の気持ちと今日の気持ちが違っても、矛盾ではありません。\n変化する自分を責めず、今の心に耳を傾けて。",a:"私は、今の自分に正直でいます。"},
{title:"完璧じゃなくていい",body:"全部をうまくやろうとしなくて大丈夫。\n少し不器用でも、迷いながらでも、あなたは歩んでいます。",a:"私は、不完全な自分にも価値を認めます。"},
{title:"あなたの笑顔を大切に",body:"誰かのために頑張りすぎていませんか。\n今日は心が軽くなることを、ひとつ選んでみてください。",a:"私は、自分が喜ぶことをしていい。"},
{title:"今は整える時間",body:"前へ進む前に、身の回りや気持ちを整える日があってもいいのです。\nゆっくり息を吐き、安心できる場所をつくってみて。",a:"私は、穏やかな時間を大切にします。"}
];
let last=-1;const btn=document.getElementById('draw'),result=document.getElementById('result');btn.addEventListener('click',()=>{let next;if(messages.length===1){next=0}else{next=Math.floor(Math.random()*(messages.length-1));if(next>=last&&last>=0)next++}last=next;const m=messages[next];document.getElementById('title').textContent=m.title;document.getElementById('message').textContent=m.body;document.getElementById('affirmation').textContent='✧ 今日のアファメーション ✧\n「'+m.a+'」';result.hidden=false;result.style.animation='none';void result.offsetWidth;result.style.animation='';btn.textContent='✧ もう一度メッセージを受け取る ✧';document.getElementById('hint').textContent='何度でも、心に響く言葉を受け取ってね 🌙';result.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'});});
</script></body></html>
